[project]
name = "web10-checker"
version = "0.3.0"
description = "Conformance checker for the Web 1.0 Specification (2026 Edition): no scripts, no third parties, no cookies, no bloat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ed Parcell" }]
dependencies = [
    # HTTP/2 with browser-shaped headers, so edges (Cloudflare especially)
    # serve the checker what they serve real visitors.
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    # Some CDNs (Berkshire Hathaway's, notably) send brotli regardless of
    # Accept-Encoding; without decoders the checker would grade gibberish.
    "brotli>=1.1",
    "zstandard>=0.22",
]

[project.scripts]
web10 = "web10check.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web10check"]
